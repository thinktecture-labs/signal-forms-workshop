<h1>Speaker profile</h1>

<form class="profile-form" [formRoot]="profileForm">
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input matInput [formField]="profileForm.name" />
    <mat-error><app-field-errors [errors]="profileForm.name().errors()" /></mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput type="email" [formField]="profileForm.email" />
    <mat-error><app-field-errors [errors]="profileForm.email().errors()" /></mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Bio</mat-label>
    <textarea matInput rows="4" [formField]="profileForm.bio"></textarea>
    <mat-hint align="end">{{ profileForm.bio().value().length }} / 280</mat-hint>
    <mat-error><app-field-errors [errors]="profileForm.bio().errors()" /></mat-error>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Website</mat-label>
    <input matInput [formField]="profileForm.website" />
    <mat-error><app-field-errors [errors]="profileForm.website().errors()" /></mat-error>
  </mat-form-field>

  <h2>Links</h2>
  @for (link of profileForm.links; track link; let i = $index) {
    <div class="link">
      <mat-form-field>
        <mat-label>Link {{ i + 1 }}</mat-label>
        <input matInput [formField]="link" />
        <mat-error><app-field-errors [errors]="link().errors()" /></mat-error>
      </mat-form-field>
      <button mat-icon-button type="button" aria-label="Remove link" (click)="removeLink(i)">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  }
  <button mat-stroked-button type="button" (click)="addLink()">
    <mat-icon>add_link</mat-icon>
    Add link
  </button>

  <mat-checkbox [formField]="profileForm.newsletter">Send me the speaker newsletter</mat-checkbox>

  <div class="actions">
    <button
      mat-flat-button
      type="submit"
      [disabled]="profileForm().submitting() || !profileForm().dirty()"
    >
      {{ profileForm().submitting() ? 'Saving...' : 'Save' }}
    </button>
  </div>
</form>
