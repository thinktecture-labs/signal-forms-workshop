<div class="tags" [class.invalid]="touched() && invalid()">
  @for (tag of value(); track tag) {
    <mat-chip [disabled]="disabled()">
      {{ tag }}
      <button matChipRemove [attr.aria-label]="'Remove ' + tag" (click)="remove(tag)">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip>
  }
  <input
    #tagField
    placeholder="Add a tag and press Enter"
    aria-label="New tag"
    [disabled]="disabled()"
    (keydown.enter)="$event.preventDefault(); add(tagField)"
    (blur)="touch.emit()"
  />
</div>
@if (touched() && invalid()) {
  @for (error of errors(); track $index) {
    <div class="error">{{ error.message }}</div>
  }
}
